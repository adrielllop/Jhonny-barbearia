<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Jhonny Santos | Barbearia</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#090909;--card:#141414;--line:#292929;--text:#fff;--muted:#aaa;--gold:#d8b15c}
    body{
      min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
      background:
        radial-gradient(circle at 50% 0%,#282015 0,transparent 35%),
        linear-gradient(160deg,#050505,#111 55%,#050505);
      display:flex;justify-content:center;padding:34px 18px;
    }
    .page{width:100%;max-width:480px;text-align:center}
    .logo-wrap{
      width:142px;height:142px;margin:0 auto 18px;border-radius:50%;
      padding:4px;background:linear-gradient(135deg,#f0d28b,#8e682d,#f0d28b);
      box-shadow:0 12px 45px #000;
    }
    .main-logo{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#111}
    h1{font-size:30px;letter-spacing:.5px;margin-bottom:7px}
    .subtitle{color:var(--gold);font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    .desc{color:var(--muted);font-size:15px;line-height:1.55;margin:14px auto 27px;max-width:390px}
    .links{display:grid;gap:14px}
    .link{
      display:flex;align-items:center;text-decoration:none;color:#fff;background:rgba(20,20,20,.92);
      border:1px solid var(--line);border-radius:18px;padding:12px 15px;min-height:78px;
      box-shadow:0 8px 25px rgba(0,0,0,.28);transition:.2s ease;text-align:left;
    }
    .link:hover,.link:active{transform:translateY(-2px);border-color:#80662f;background:#191919}
    .icon{width:52px;height:52px;object-fit:cover;border-radius:14px;margin-right:15px;flex:0 0 auto}
    .content{min-width:0;flex:1}
    .name{font-size:17px;font-weight:800;margin-bottom:4px}
    .hint{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .arrow{font-size:25px;color:var(--gold);padding-left:10px}
    footer{margin-top:30px;color:#666;font-size:12px}
  </style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
      <img class="main-logo" src="https://i.postimg.cc/cJkDNKbL/Screenshot-20260829-224356-Instagram.png" alt="Logo da barbearia">
    </div>

    <h1>Jhonny Santos</h1>
    <div class="subtitle">Barbearia</div>
    <p class="desc">Corte, estilo e atendimento de qualidade. Entre em contato ou encontre a barbearia pelos links abaixo.</p>

    <section class="links">
      <a class="link" href="https://wa.me/553497303352" target="_blank" rel="noopener noreferrer">
        <img class="icon" src="https://i.postimg.cc/SKsgc7f3/c4d3ed9d48ee3d92225b3545813d8bb6.jpg" alt="WhatsApp">
        <div class="content">
          <div class="name">WhatsApp</div>
          <div class="hint">+55 34 9730-3352 • Falar agora</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="link" href="https://www.instagram.com/jhonny_santos.77?igsi=MWYzcXhudTd5emJraA==" target="_blank" rel="noopener noreferrer">
        <img class="icon" src="https://i.postimg.cc/3xw5NGzw/ae599d8043cac580437e26da1f8c8aeb.jpg" alt="Instagram">
        <div class="content">
          <div class="name">Instagram</div>
          <div class="hint">@jhonny_santos.77</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="link" href="https://maps.app.goo.gl/u8V13fW5ePgpX1Ws8?g_st=ac" target="_blank" rel="noopener noreferrer">
        <img class="icon" src="https://i.postimg.cc/4xX45nM5/3b9785234a0c54c34b39dcea0c0e624c.jpg" alt="Google Maps">
        <div class="content">
          <div class="name">Google Maps</div>
          <div class="hint">Ver localização e rota</div>
        </div>
        <div class="arrow">›</div>
      </a>
    </section>

    <footer>© Jhonny Santos • Barbearia</footer>
  </main>
</body>
</html>
